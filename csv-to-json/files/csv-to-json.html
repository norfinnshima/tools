<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV to JSON</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f1e8;
      --panel: #fffdf7;
      --border: #d6c7af;
      --text: #2e261d;
      --muted: #6f6355;
      --accent: #7b4b2a;
      --accent-strong: #5f3417;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(123, 75, 42, 0.12), transparent 32%),
        linear-gradient(180deg, #f8f5ee 0%, var(--bg) 100%);
      color: var(--text);
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 32px auto 48px;
      padding: 24px;
      background: rgba(255, 253, 247, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(59, 42, 24, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 40px);
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: var(--muted);
    }

    .toolbar,
    .panel {
      margin-top: 24px;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .toolbar {
      display: grid;
      gap: 16px;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: center;
    }

    label {
      font-weight: 700;
    }

    input[type="file"],
    select,
    button,
    a.button {
      font: inherit;
    }

    select,
    button,
    a.button {
      min-height: 40px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    button,
    a.button {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover,
    a.button:hover {
      background: var(--accent-strong);
    }

    button:disabled,
    a.button[aria-disabled="true"] {
      background: #b8ab9a;
      cursor: not-allowed;
      pointer-events: none;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px 14px;
      margin-top: 16px;
    }

    .checkbox-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      margin-top: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font: 14px/1.5 "SFMono-Regular", Consolas, monospace;
      resize: vertical;
      background: #fff;
      color: var(--text);
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }

    .status {
      font-size: 14px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      main {
        width: min(100%, calc(100% - 20px));
        margin: 10px auto 24px;
        padding: 16px;
      }

      .toolbar,
      .panel {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>CSV to JSON</h1>
      <p>CSV を読み込み、出力したい列だけ選んで JSON として保存します。</p>
    </header>

    <section class="toolbar" aria-label="変換設定">
      <div class="toolbar-row">
        <label for="fileInput">CSV ファイル</label>
        <input id="fileInput" type="file" accept=".csv,text/csv">
      </div>

      <div class="toolbar-row">
        <label for="encodingSelect">文字コード</label>
        <select id="encodingSelect">
          <option value="utf-8" selected>UTF-8</option>
          <option value="shift-jis">Shift_JIS</option>
        </select>

        <button id="selectAllButton" type="button" disabled>全選択</button>
        <button id="clearButton" type="button" disabled>全解除</button>
        <button id="convertButton" type="button" disabled>JSON に変換</button>
        <a id="downloadLink" class="button" aria-disabled="true">JSON を保存</a>
      </div>

      <div>
        <label>出力列</label>
        <div id="columnSelector" class="checkbox-grid"></div>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">
        <label for="csvPreview">CSV プレビュー</label>
        <span id="csvStatus" class="status">ファイル未選択</span>
      </div>
      <textarea id="csvPreview" readonly></textarea>
    </section>

    <section class="panel">
      <div class="section-title">
        <label for="jsonOutput">JSON 出力</label>
        <span id="jsonStatus" class="status">未変換</span>
      </div>
      <textarea id="jsonOutput" readonly></textarea>
    </section>
  </main>

  <script>
    const state = {
      baseName: "output",
      headers: [],
      rows: [],
      downloadUrl: null,
    };

    const fileInput = document.getElementById("fileInput");
    const encodingSelect = document.getElementById("encodingSelect");
    const selectAllButton = document.getElementById("selectAllButton");
    const clearButton = document.getElementById("clearButton");
    const convertButton = document.getElementById("convertButton");
    const downloadLink = document.getElementById("downloadLink");
    const columnSelector = document.getElementById("columnSelector");
    const csvPreview = document.getElementById("csvPreview");
    const jsonOutput = document.getElementById("jsonOutput");
    const csvStatus = document.getElementById("csvStatus");
    const jsonStatus = document.getElementById("jsonStatus");

    function resetDownloadLink() {
      if (state.downloadUrl) {
        URL.revokeObjectURL(state.downloadUrl);
      }
      state.downloadUrl = null;
      downloadLink.removeAttribute("href");
      downloadLink.removeAttribute("download");
      downloadLink.setAttribute("aria-disabled", "true");
    }

    function setControlsEnabled(enabled) {
      selectAllButton.disabled = !enabled;
      clearButton.disabled = !enabled;
      convertButton.disabled = !enabled;
    }

    function parseCsv(text) {
      const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const rows = [];
      let cell = "";
      let row = [];
      let inQuotes = false;

      for (let index = 0; index < normalized.length; index += 1) {
        const char = normalized[index];
        const nextChar = normalized[index + 1];

        if (char === "\"") {
          if (inQuotes && nextChar === "\"") {
            cell += "\"";
            index += 1;
          } else {
            inQuotes = !inQuotes;
          }
          continue;
        }

        if (char === "," && !inQuotes) {
          row.push(cell);
          cell = "";
          continue;
        }

        if (char === "\n" && !inQuotes) {
          row.push(cell);
          if (row.some((value) => value !== "")) {
            rows.push(row);
          }
          row = [];
          cell = "";
          continue;
        }

        cell += char;
      }

      if (cell !== "" || row.length > 0) {
        row.push(cell);
        if (row.some((value) => value !== "")) {
          rows.push(row);
        }
      }

      return rows;
    }

    function sanitizeHeaders(rawHeaders) {
      return rawHeaders.map((header, index) => {
        const trimmed = (header ?? "").trim();
        return trimmed || `column_${index + 1}`;
      });
    }

    function renderColumnSelector(headers) {
      columnSelector.replaceChildren();

      headers.forEach((header, index) => {
        const label = document.createElement("label");
        label.className = "checkbox-item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = String(index);
        checkbox.checked = true;

        const text = document.createElement("span");
        text.textContent = header;

        label.append(checkbox, text);
        columnSelector.append(label);
      });
    }

    function getSelectedIndexes() {
      return [...columnSelector.querySelectorAll('input[type="checkbox"]')]
        .filter((checkbox) => checkbox.checked)
        .map((checkbox) => Number(checkbox.value));
    }

    function toObjects(headers, rows, selectedIndexes) {
      return rows.map((row) => {
        const record = {};

        selectedIndexes.forEach((index) => {
          record[headers[index]] = row[index] ?? "";
        });

        return record;
      });
    }

    async function readFileText(file, encoding) {
      const buffer = await file.arrayBuffer();
      return new TextDecoder(encoding).decode(buffer);
    }

    async function loadCsvFile() {
      const [file] = fileInput.files;
      if (!file) {
        return;
      }

      resetDownloadLink();
      jsonOutput.value = "";
      jsonStatus.textContent = "未変換";

      const text = await readFileText(file, encodingSelect.value);
      const rows = parseCsv(text);

      if (rows.length === 0) {
        throw new Error("CSV に有効な行がありません。");
      }

      state.baseName = file.name.replace(/\.[^.]+$/, "") || "output";
      state.headers = sanitizeHeaders(rows[0]);
      state.rows = rows.slice(1);

      csvPreview.value = text;
      csvStatus.textContent = `${state.rows.length} 行 / ${state.headers.length} 列`;
      renderColumnSelector(state.headers);
      setControlsEnabled(true);
    }

    function updateDownload(jsonText) {
      resetDownloadLink();
      state.downloadUrl = URL.createObjectURL(
        new Blob([jsonText], { type: "application/json" })
      );
      downloadLink.href = state.downloadUrl;
      downloadLink.download = `${state.baseName}.json`;
      downloadLink.setAttribute("aria-disabled", "false");
    }

    fileInput.addEventListener("change", async () => {
      try {
        await loadCsvFile();
      } catch (error) {
        state.headers = [];
        state.rows = [];
        csvPreview.value = "";
        csvStatus.textContent = error.message;
        columnSelector.replaceChildren();
        setControlsEnabled(false);
      }
    });

    encodingSelect.addEventListener("change", async () => {
      if (fileInput.files.length === 0) {
        return;
      }

      try {
        await loadCsvFile();
      } catch (error) {
        csvStatus.textContent = error.message;
      }
    });

    selectAllButton.addEventListener("click", () => {
      columnSelector.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
        checkbox.checked = true;
      });
    });

    clearButton.addEventListener("click", () => {
      columnSelector.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
        checkbox.checked = false;
      });
    });

    convertButton.addEventListener("click", () => {
      const selectedIndexes = getSelectedIndexes();
      if (selectedIndexes.length === 0) {
        jsonStatus.textContent = "1 列以上選択してください";
        jsonOutput.value = "";
        resetDownloadLink();
        return;
      }

      const records = toObjects(state.headers, state.rows, selectedIndexes);
      const jsonText = JSON.stringify(records, null, 2);
      jsonOutput.value = jsonText;
      jsonStatus.textContent = `${records.length} 件を変換`;
      updateDownload(jsonText);
    });

    window.addEventListener("beforeunload", resetDownloadLink);
  </script>
</body>
</html>
